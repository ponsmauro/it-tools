<div class="tool-content url-encoder-tool">
    <h2>URL Encoder / Decoder</h2>
    <p>Encode and decode URL components using native browser functions.</p>

    <div class="tool-grid">
        <div class="panel">
            <label for="url-encoder-input">Input</label>
            <textarea id="url-encoder-input" class="tool-textarea" placeholder="Type or paste text here..."></textarea>
        </div>

        <div class="panel actions">
            <button type="button" id="btn-url-encode" class="btn-primary">Encode</button>
            <button type="button" id="btn-url-decode" class="btn-primary">Decode</button>
            <button type="button" id="btn-url-clear" class="btn-secondary">Clear</button>
            <button type="button" id="btn-url-copy" class="btn-primary">Copy Output</button>
        </div>

        <div class="panel">
            <label for="url-encoder-output">Output</label>
            <textarea id="url-encoder-output" class="tool-textarea" placeholder="Result will appear here..." readonly></textarea>
        </div>
    </div>

    <div id="url-encoder-status" class="status" aria-live="polite"></div>
</div>

<style>
    .url-encoder-tool {
        width: 100%;
        max-width: 100%;
    }

    .url-encoder-tool h2 {
        margin-bottom: 8px;
    }

    .url-encoder-tool p {
        margin-bottom: 16px;
        color: var(--text-secondary);
    }

    .tool-grid {
        display: grid;
        gap: 12px;
    }

    .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .panel.actions {
        display: flex;
        flex-wrap: nowrap;
        flex-direction: row;
        gap: 8px;
        overflow-x: auto;
    }

    .tool-textarea {
        width: 100%;
        min-height: 180px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.4;
        resize: vertical;
        background: var(--bg-color);
        color: var(--text-primary);
    }

    .status {
        margin-top: 8px;
        min-height: 24px;
        font-size: 14px;
        color: var(--success-text);
    }

    .status.error {
        color: var(--error-text);
    }
</style>

<script>
    (function initUrlEncoderTool() {
        const input = document.getElementById('url-encoder-input');
        const output = document.getElementById('url-encoder-output');
        const status = document.getElementById('url-encoder-status');
        const encodeButton = document.getElementById('btn-url-encode');
        const decodeButton = document.getElementById('btn-url-decode');
        const clearButton = document.getElementById('btn-url-clear');
        const copyButton = document.getElementById('btn-url-copy');

        if (!input || !output || !status || !encodeButton || !decodeButton || !clearButton || !copyButton) {
            return;
        }

        function setStatus(message, isError) {
            status.textContent = message;
            status.classList.toggle('error', Boolean(isError));
        }

        encodeButton.addEventListener('click', function () {
            try {
                output.value = encodeURIComponent(input.value);
                setStatus('Encoded successfully.', false);
            } catch (error) {
                output.value = '';
                setStatus('Encoding failed.', true);
            }
        });

        decodeButton.addEventListener('click', function () {
            try {
                output.value = decodeURIComponent(input.value);
                setStatus('Decoded successfully.', false);
            } catch (error) {
                output.value = '';
                setStatus('Invalid encoded input for decoding.', true);
            }
        });

        clearButton.addEventListener('click', function () {
            input.value = '';
            output.value = '';
            setStatus('Cleared.', false);
            input.focus();
        });

        copyButton.addEventListener('click', async function () {
            try {
                await navigator.clipboard.writeText(output.value);
                setStatus('Output copied to clipboard.', false);
            } catch (error) {
                setStatus('Clipboard copy failed.', true);
            }
        });
    })();
</script>
