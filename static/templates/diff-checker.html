<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Diff Checker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Diff Checker</h1>
                <p>Compare two texts and show differences.</p>
              </div>

              <div class="tool-grid">
                <div class="panel">
                  <label for="diff-original">Original Text</label>
                  <textarea id="diff-original" class="tool-textarea" rows="10" placeholder="Paste original text here..."></textarea>
                </div>

                <div class="panel">
                  <label for="diff-modified">Modified Text</label>
                  <textarea id="diff-modified" class="tool-textarea" rows="10" placeholder="Paste modified text here..."></textarea>
                </div>
              </div>
              
              <div class="actions" style="margin-top: 12px; margin-bottom: 12px;">
                <button id="compare-btn" type="button" class="btn-primary">Compare</button>
                <button id="clear-btn" type="button" class="btn-secondary">Clear</button>
              </div>

              <div class="panel">
                <h2>Differences</h2>
                <div id="diff-output" class="diff-output">
                  <div class="diff-placeholder">Click "Compare" to see differences</div>
                </div>
              </div>
            </section>
        </div>
    </main>

<style>
  .tool-page { display: flex; flex-direction: column; gap: 12px; }
  .tool-header h1 { margin-bottom: 4px; font-size: 18px; }
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; }
  .panel label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-secondary); }
  .tool-textarea { width: 100%; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-primary { background: var(--primary-color); color: var(--text-primary); border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--border-color); color: var(--text-primary); border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .btn-secondary:hover { background: var(--border-color); }
  .diff-output { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace; font-size: 13px; min-height: 150px; white-space: pre-wrap; overflow-x: auto; }
  .diff-placeholder { color: var(--text-secondary); font-style: italic; }
  .diff-added { background-color: rgba(16, 185, 129, 0.2); color: var(--success-text); }
  .diff-removed { background-color: rgba(239, 68, 68, 0.2); color: var(--error-text); text-decoration: line-through; }
  .tool-page > p { color: var(--text-secondary); font-size: 13px; margin: 0; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
<script>
  (function () {
    const originalEl = document.getElementById('diff-original');
    const modifiedEl = document.getElementById('diff-modified');
    const outputEl = document.getElementById('diff-output');
    const compareBtn = document.getElementById('compare-btn');
    const clearBtn = document.getElementById('clear-btn');

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '<')
        .replaceAll('>', '>')
        .replaceAll('"', '"')
        .replaceAll("'", '&#39;');
    }

    function compare() {
      const text1 = originalEl.value;
      const text2 = modifiedEl.value;

      if (!text1 && !text2) {
        outputEl.innerHTML = '<div class="diff-placeholder">Please enter text to compare</div>';
        return;
      }

      try {
        const dmp = new diff_match_patch();
        const diffs = dmp.diff_main(text1, text2);
        dmp.diff_cleanupSemantic(diffs);

        let html = '';
        for (let i = 0; i < diffs.length; i++) {
          const op = diffs[i][0];    // Operation (insert, delete, equal)
          const data = diffs[i][1];  // Text of change
          const escapedData = escapeHtml(data);

          if (op === 1) { // Insert
            html += `<span class="diff-added">${escapedData}</span>`;
          } else if (op === -1) { // Delete
            html += `<span class="diff-removed">${escapedData}</span>`;
          } else { // Equal
            html += `<span>${escapedData}</span>`;
          }
        }

        outputEl.innerHTML = html || '<div class="diff-placeholder">Texts are identical</div>';
      } catch (err) {
        outputEl.innerHTML = `<div style="color: var(--error-text);">Error: ${err.message}</div>`;
      }
    }

    compareBtn.addEventListener('click', compare);
    
    clearBtn.addEventListener('click', () => {
      originalEl.value = '';
      modifiedEl.value = '';
      outputEl.innerHTML = '<div class="diff-placeholder">Click "Compare" to see differences</div>';
    });
  })();
</script>
</body>
</html>
