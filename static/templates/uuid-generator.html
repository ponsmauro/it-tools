<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.uuid-generator" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="uuid-tool tool-container">
                <h1>{{ tr "tools.uuid-generator.title" }}</h1>
                <p>{{ tr "tools.uuid-generator.desc" }}</p>
                
                <div class="format-options">
                    <div class="option-group">
                        <label>{{ tr "tools.uuid-generator.count" }}: <span id="count-value">10</span></label>
                        <input type="range" id="count-slider" min="1" max="50" value="10" class="slider" oninput="updateCountValue()">
                    </div>
                    
                    <div class="option-group checkboxes">
                        <label>
                            <input type="checkbox" id="uppercase" checked>
                            {{ tr "tools.uuid-generator.uppercase" }}
                        </label>
                        <label>
                            <input type="checkbox" id="hyphens" checked>
                            {{ tr "tools.uuid-generator.hyphens" }}
                        </label>
                        <label>
                            <input type="checkbox" id="braces">
                            {{ tr "tools.uuid-generator.braces" }}
                        </label>
                    </div>
                </div>
                
                <div class="controls">
                    <button onclick="generate()" class="btn-primary">{{ tr "tools.generate" }}</button>
                    <button onclick="copyAll()" id="copy-btn" disabled class="btn-secondary">{{ tr "tools.copy-all" }}</button>
                    <button onclick="clearList()" class="btn-secondary">{{ tr "tools.clear" }}</button>
                </div>
                
                <div id="uuid-list" class="uuid-list"></div>
                
                <div class="stats" id="stats" style="display: none;">
                    {{ tr "tools.stats.generated" }} <span id="count">0</span> UUIDs
                </div>
            </div>
        </div>
    </main>

    <script>
        let uuids = [];
        
        function updateCountValue() {
            const countValue = document.getElementById('count-slider').value;
            document.getElementById('count-value').textContent = countValue;
        }
        
        function formatUUID(uuid) {
            const uppercase = document.getElementById('uppercase').checked;
            const hyphens = document.getElementById('hyphens').checked;
            const braces = document.getElementById('braces').checked;
            
            // Start with the raw UUID
            let formattedUUID = uuid;
            
            // First handle case (uppercase/lowercase)
            if (uppercase) {
                formattedUUID = formattedUUID.toUpperCase();
            } else {
                formattedUUID = formattedUUID.toLowerCase();
            }
            
            // Then handle hyphens (remove if not wanted)
            if (!hyphens) {
                formattedUUID = formattedUUID.replace(/-/g, '');
            }
            
            // Finally add braces if wanted
            if (braces) {
                formattedUUID = '{' + formattedUUID + '}';
            }
            
            return formattedUUID;
        }
        
        function generate() {
            // Ensure count is between 1 and 50
            const count = Math.max(1, Math.min(50, parseInt(document.getElementById('count-slider').value) || 1));
            
            // Update slider value if it was out of bounds
            document.getElementById('count-slider').value = count;
            document.getElementById('count-value').textContent = count;
            
            uuids = [];
            
            for (let i = 0; i < count; i++) {
                const rawUUID = crypto.randomUUID();
                const formattedUUID = formatUUID(rawUUID);
                uuids.unshift(formattedUUID);
            }
            
            renderList();
            updateStats();
            document.getElementById('copy-btn').disabled = false;
        }
        
        function renderList() {
            const container = document.getElementById('uuid-list');
            container.innerHTML = uuids.map((uuid, index) => 
                `<div class="uuid-item" onclick="copyUUID(${index})" title="Click to copy">
                    <code>${uuid}</code>
                </div>`
            ).join('');
        }
        
        function copyUUID(index) {
            try {
                navigator.clipboard.writeText(uuids[index]).then(() => {
                    const item = event.currentTarget;
                    item.style.background = '#d1fae5';
                    item.title = 'Copied!';
                    setTimeout(() => {
                        item.style.background = '';
                        item.title = 'Click to copy';
                    }, 1500);
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                    // Fallback for browsers without clipboard API
                    copyToClipboardFallback(uuids[index]);
                });
            } catch (err) {
                console.error('Error accessing clipboard: ', err);
                copyToClipboardFallback(uuids[index]);
            }
        }
        
        function copyAll() {
            const text = uuids.join('\n');
            try {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copy-btn');
                    const original = btn.textContent;
                    btn.textContent = '✅ Copied!';
                    btn.style.background = '#10b981';
                    setTimeout(() => {
                        btn.textContent = original;
                        btn.style.background = '';
                    }, 1500);
                }).catch(err => {
                    console.error('Failed to copy all: ', err);
                    copyToClipboardFallback(text);
                });
            } catch (err) {
                console.error('Error accessing clipboard: ', err);
                copyToClipboardFallback(text);
            }
        }
        
        // Fallback method for browsers without clipboard API
        function copyToClipboardFallback(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                const msg = successful ? 'Copied!' : 'Failed to copy';
                console.log(msg);
            } catch (err) {
                console.error('Fallback: Could not copy text: ', err);
            }
            
            document.body.removeChild(textArea);
        }
        
        function clearList() {
            uuids = [];
            document.getElementById('uuid-list').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('copy-btn').disabled = true;
        }
        
        function updateStats() {
            document.getElementById('count').textContent = uuids.length;
            document.getElementById('stats').style.display = 'block';
        }
    </script>

    <style>
        .uuid-tool { max-width: 100%; padding: 0 16px; }
        .format-options { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 14px; margin: 16px 0; }
        .option-group { margin-bottom: 12px; color: var(--text-secondary); font-size: 13px; }
        .option-group:last-child { margin-bottom: 0; }
        .option-group.checkboxes { display: flex; flex-wrap: wrap; gap: 12px; }
        .slider { width: 100%; margin: 8px 0; }
        .controls { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
        .uuid-list { display: flex; flex-direction: column; gap: 6px; margin: 16px 0; max-height: 50vh; overflow-y: auto; }
        .uuid-item { padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-size: 13px; font-family: ui-monospace, monospace; color: var(--text-primary); }
        .uuid-item:hover { background: var(--bg-color); border-color: var(--border-color); }
        .uuid-item.selected { background: var(--primary-light); border-color: var(--primary-color); }
        .stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .uuid-tool p { color: var(--text-secondary); font-size: 12px; margin: 0 0 12px 0; }
        .uuid-item:hover {
            transform: translateX(4px);
        }
        .uuid-item code {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            letter-spacing: -0.02em;
            word-break: break-all;
            display: block;
            color: var(--text-primary);
        }
        .stats {
            padding: 12px;
            background: var(--success-bg);
            border: 1px solid #166534;
            border-radius: 6px;
            font-weight: 500;
            color: var(--success-text);
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            .controls .btn-primary, .controls .btn-secondary {
                width: 100%;
            }
            .uuid-tool {
                padding: 0 10px;
            }
            .option-group.checkboxes {
                flex-direction: column;
                gap: 10px;
            }
            .format-options {
                padding: 12px;
            }
        }
    </style>
</body>
</html>
