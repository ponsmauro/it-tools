<!DOCTYPE html>
<html lang=\"{{ .Lang }}\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>{{ tr \"app.title\" }} - {{ tr \"tools.uuid-generator\" | default \"UUID Generator\" }}</title>
    <link rel=\"stylesheet\" href=\"/static/css/style.css\">
</head>
<body>
    <div class=\"tabs\">
        <a href=\"/\" class=\"tab active\">{{ tr \"nav.it-tools\" }}</a>
    </div>

    <main class=\"main\">
        <div class=\"container\">
            <div class=\"uuid-tool tool-container\">
                <h1>{{ tr \"tools.uuid-generator.title\" | default \"UUID v4 Generator\" }}</h1>
                <p>{{ tr \"tools.uuid-generator.desc\" | default \"Generate RFC 4122 v4 UUIDs offline\" }}</p>
                
                <div class=\"controls\">
                    <button onclick=\"generate()\" class=\"btn-primary\">{{ tr \"tools.generate\" | default \"Generate 10\" }}</button>
                    <button onclick=\"copyAll()\" id=\"copy-btn\" disabled class=\"btn-secondary\">{{ tr \"tools.copy-all\" | default \"Copy All\" }}</button>
                    <button onclick=\"clearList()\" class=\"btn-secondary\">{{ tr \"tools.clear\" | default \"Clear\" }}</button>
                </div>
                
                <div id=\"uuid-list\" class=\"uuid-list\"></div>
                
                <div class=\"stats\" id=\"stats\" style=\"display: none;\">
                    {{ tr \"tools.stats.generated\" | default \"Generated\" }} <span id=\"count\">0</span> UUIDs
                </div>
            </div>
        </div>
    </main>

    <script>
        let uuids = [];
        const maxUUIDs = 10;
        
        function generate() {
            for (let i = 0; i < maxUUIDs; i++) {
                const uuid = crypto.randomUUID();
                uuids.unshift(uuid);
            }
            uuids = uuids.slice(0, maxUUIDs);
            renderList();
            updateStats();
            document.getElementById('copy-btn').disabled = false;
        }
        
        function renderList() {
            const container = document.getElementById('uuid-list');
            container.innerHTML = uuids.map((uuid, index) => 
                `<div class="uuid-item" onclick="copyUUID(${index})" title="Click to copy">
                    <code>${uuid}</code>
                </div>`
            ).join('');
        }
        
        function copyUUID(index) {
            navigator.clipboard.writeText(uuids[index]).then(() => {
                const item = event.currentTarget;
                item.style.background = '#d1fae5';
                item.title = 'Copied!';
                setTimeout(() => {
                    item.style.background = '';
                    item.title = 'Click to copy';
                }, 1500);
            });
        }
        
        function copyAll() {
            const text = uuids.join('\\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                const original = btn.textContent;
                btn.textContent = '✅ Copied!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                }, 1500);
            });
        }
        
        function clearList() {
            uuids = [];
            document.getElementById('uuid-list').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('copy-btn').disabled = true;
        }
        
        function updateStats() {
            document.getElementById('count').textContent = uuids.length;
            document.getElementById('stats').style.display = 'block';
        }
    </script>

    <style>
        .uuid-tool {
            max-width: 100%;
            padding: 0 20px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary-color, #2563eb);
            color: white;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-primary:hover, .btn-secondary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .uuid-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 24px 0;
            max-height: 60vh;
            overflow-y: auto;
        }
        .uuid-item {
            padding: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .uuid-item:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateX(4px);
        }
        .uuid-item code {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 14px;
            letter-spacing: -0.02em;
            word-break: break-all;
            display: block;
        }
        .stats {
            padding: 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            font-weight: 500;
            color: #166534;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
            }
            .uuid-tool {
                padding: 0 12px;
            }
        }
    </style>
</body>
</html>
