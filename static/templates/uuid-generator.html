<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.uuid-generator" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="uuid-tool tool-container">
                <h1>{{ tr "tools.uuid-generator.title" }}</h1>
                <p>{{ tr "tools.uuid-generator.desc" }}</p>
                
                <div class="format-options">
                    <div class="option-group">
                        <label>{{ tr "tools.uuid-generator.count" }}: <span id="count-value">10</span></label>
                        <input type="range" id="count-slider" min="1" max="50" value="10" class="slider" oninput="updateCountValue()">
                    </div>
                    
                    <div class="option-group checkboxes">
                        <label>
                            <input type="checkbox" id="uppercase" checked>
                            {{ tr "tools.uuid-generator.uppercase" }}
                        </label>
                        <label>
                            <input type="checkbox" id="hyphens" checked>
                            {{ tr "tools.uuid-generator.hyphens" }}
                        </label>
                        <label>
                            <input type="checkbox" id="braces">
                            {{ tr "tools.uuid-generator.braces" }}
                        </label>
                    </div>
                </div>
                
                <div class="controls">
                    <button onclick="generate()" class="btn-primary">{{ tr "tools.generate" }}</button>
                    <button onclick="copyAll()" id="copy-btn" disabled class="btn-secondary">{{ tr "tools.copy-all" }}</button>
                    <button onclick="clearList()" class="btn-secondary">{{ tr "tools.clear" }}</button>
                </div>
                
                <div id="uuid-list" class="uuid-list"></div>
                
                <div class="stats hidden" id="stats">
                    {{ tr "tools.stats.generated" }} <span id="count">0</span> UUIDs
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/uuid-generator.js"></script>

    
</body>
</html>
