<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - IP Subnet Calculator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>IP Subnet Calculator</h1>
                <p>Calculate subnets, CIDR, and IP ranges.</p>
              </div>

              <div class="tool-grid">
                <div class="panel">
                  <label for="ip-input">IP Address / CIDR</label>
                  <input type="text" id="ip-input" class="tool-input" value="192.168.1.1/24" placeholder="192.168.1.1/24">
                  <div class="actions">
                    <button id="calc-btn" type="button" class="btn-primary">Calculate</button>
                  </div>
                </div>

                <div class="panel">
                  <h2>Results</h2>
                  <div id="ip-results" class="ip-results">
                    <div class="result-row">
                      <span class="result-label">IP Address:</span>
                      <span id="res-ip" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Network Address:</span>
                      <span id="res-network" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Usable Host IP Range:</span>
                      <span id="res-range" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Broadcast Address:</span>
                      <span id="res-broadcast" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Total Number of Hosts:</span>
                      <span id="res-hosts" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Number of Usable Hosts:</span>
                      <span id="res-usable" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Subnet Mask:</span>
                      <span id="res-mask" class="result-value">-</span>
                    </div>
                  </div>
                  <div id="ip-error" class="error-message hidden"></div>
                </div>
              </div>
            </section>
        </div>
    </main>



<script src="/static/js/ip-calculator.js"></script>
</body>
</html>
