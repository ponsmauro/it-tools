<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - IP Subnet Calculator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>IP Subnet Calculator</h1>
                <p>Calculate subnets, CIDR, and IP ranges.</p>
              </div>

              <div class="tool-grid">
                <div class="panel">
                  <label for="ip-input">IP Address / CIDR</label>
                  <input type="text" id="ip-input" class="tool-input" value="192.168.1.1/24" placeholder="192.168.1.1/24">
                  <div class="actions">
                    <button id="calc-btn" type="button" class="btn-primary">Calculate</button>
                  </div>
                </div>

                <div class="panel">
                  <h2>Results</h2>
                  <div id="ip-results" class="ip-results">
                    <div class="result-row">
                      <span class="result-label">IP Address:</span>
                      <span id="res-ip" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Network Address:</span>
                      <span id="res-network" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Usable Host IP Range:</span>
                      <span id="res-range" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Broadcast Address:</span>
                      <span id="res-broadcast" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Total Number of Hosts:</span>
                      <span id="res-hosts" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Number of Usable Hosts:</span>
                      <span id="res-usable" class="result-value">-</span>
                    </div>
                    <div class="result-row">
                      <span class="result-label">Subnet Mask:</span>
                      <span id="res-mask" class="result-value">-</span>
                    </div>
                  </div>
                  <div id="ip-error" class="error-message" style="display: none;"></div>
                </div>
              </div>
            </section>
        </div>
    </main>

<style>
  .tool-page { display: flex; flex-direction: column; gap: 12px; }
  .tool-header h1 { margin-bottom: 4px; font-size: 18px; }
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; }
  .panel label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-secondary); }
  .tool-input { width: 100%; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 16px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn-primary { background: var(--primary-color); color: var(--text-primary); border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .ip-results { display: flex; flex-direction: column; gap: 8px; }
  .result-row { display: flex; justify-content: space-between; padding: 8px; background: var(--bg-color); border-radius: 4px; border: 1px solid var(--border-color); }
  .result-label { color: var(--text-secondary); font-size: 13px; }
  .result-value { color: var(--success-text); font-family: ui-monospace, monospace; font-size: 13px; font-weight: 500; }
  .error-message { color: var(--error-text); background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 4px; margin-top: 12px; font-size: 13px; }
  .tool-page > p { color: var(--text-secondary); font-size: 13px; margin: 0; }
</style>

<script>
  (function () {
    const inputEl = document.getElementById('ip-input');
    const calcBtn = document.getElementById('calc-btn');
    const errorEl = document.getElementById('ip-error');
    
    const resIp = document.getElementById('res-ip');
    const resNetwork = document.getElementById('res-network');
    const resRange = document.getElementById('res-range');
    const resBroadcast = document.getElementById('res-broadcast');
    const resHosts = document.getElementById('res-hosts');
    const resUsable = document.getElementById('res-usable');
    const resMask = document.getElementById('res-mask');

    function ip2long(ip) {
      return ip.split('.').reduce((ipInt, octet) => (ipInt << 8) + parseInt(octet, 10), 0) >>> 0;
    }

    function long2ip(ipInt) {
      return (
        ((ipInt >>> 24) & 255) + '.' +
        ((ipInt >>> 16) & 255) + '.' +
        ((ipInt >>> 8) & 255) + '.' +
        (ipInt & 255)
      );
    }

    function calculate() {
      const input = inputEl.value.trim();
      errorEl.style.display = 'none';
      
      try {
        let ipStr = input;
        let cidr = 24;
        
        if (input.includes('/')) {
          const parts = input.split('/');
          ipStr = parts[0];
          cidr = parseInt(parts[1], 10);
        }
        
        if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ipStr)) {
          throw new Error('Invalid IP address format');
        }
        
        if (isNaN(cidr) || cidr < 0 || cidr > 32) {
          throw new Error('Invalid CIDR notation (must be 0-32)');
        }
        
        const ipParts = ipStr.split('.').map(Number);
        if (ipParts.some(p => p < 0 || p > 255)) {
          throw new Error('IP octets must be between 0 and 255');
        }
        
        const ipLong = ip2long(ipStr);
        const maskLong = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
        const networkLong = (ipLong & maskLong) >>> 0;
        const broadcastLong = (networkLong | ~maskLong) >>> 0;
        
        const totalHosts = cidr === 32 ? 1 : Math.pow(2, 32 - cidr);
        const usableHosts = cidr >= 31 ? 0 : totalHosts - 2;
        
        let firstHost = '-';
        let lastHost = '-';
        
        if (usableHosts > 0) {
          firstHost = long2ip(networkLong + 1);
          lastHost = long2ip(broadcastLong - 1);
        }
        
        resIp.textContent = ipStr;
        resNetwork.textContent = long2ip(networkLong);
        resRange.textContent = usableHosts > 0 ? `${firstHost} - ${lastHost}` : 'N/A';
        resBroadcast.textContent = long2ip(broadcastLong);
        resHosts.textContent = totalHosts.toLocaleString();
        resUsable.textContent = usableHosts.toLocaleString();
        resMask.textContent = long2ip(maskLong);
        
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        
        resIp.textContent = '-';
        resNetwork.textContent = '-';
        resRange.textContent = '-';
        resBroadcast.textContent = '-';
        resHosts.textContent = '-';
        resUsable.textContent = '-';
        resMask.textContent = '-';
      }
    }

    calcBtn.addEventListener('click', calculate);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') calculate();
    });
    
    // Initial calculation
    calculate();
  })();
</script>
</body>
</html>
