<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.all" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="tabs-bar" id="tabs-bar">
            <div class="home-tab tab-item active" data-tab="home" onclick="switchTab('home')">
                <span>IT Tools</span>
                <button class="close-btn" onclick="event.stopPropagation(); closeTab('home')">×</button>
            </div>
        </div>

        <div class="tab-content">
            <!-- Home Tab -->
            <div id="home-tab" class="tab-panel active">
                <div class="container">
                    <section class="tools-section">
                        <input type="text" id="tool-search" placeholder="Search tools..." class="search-input">
                        <div class="tools-grid" id="tools-grid">
                            {{ range .Tools }}
                            <div class="tool-card" data-tool="{{ .ID }}" data-search="{{ .Name }} {{ .Description }} {{ .Category }}">
                                <div class="tool-info">
                                    <div class="tool-icon">{{ .Icon }}</div>
                                    <h4>{{ .Name }}</h4>
                                    <p>{{ .Description }}</p>
                                    <span class="tool-category">{{ .Category }}</span>
                                </div>
                                <button class="open-tool-btn" onclick="openTool('{{ .ID }}')">Open</button>
                            </div>
                            {{ end }}
                        </div>
                    </section>
                </div>
            </div>

            <!-- Dynamic Tool Tabs -->
            <div id="tool-tabs"></div>
        </div>
    </div>

    <script>
        let tabCounter = 0;
        const maxTabs = 8;

        // Search functionality
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('tool-search');
            const toolCards = document.querySelectorAll('.tool-card');
            
            searchInput.addEventListener('input', function() {
                const query = searchInput.value.toLowerCase();
                toolCards.forEach(card => {
                    const searchText = card.getAttribute('data-search').toLowerCase();
                    if (searchText.includes(query)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // Open tool in new tab via POST
        async function openTool(toolId) {
            if (document.querySelectorAll('.tab-item').length >= maxTabs) {
                alert('Max 8 tabs');
                return;
            }

            const tabsBar = document.getElementById('tabs-bar');
            const toolTabs = document.getElementById('tool-tabs');
            
            tabCounter++;
            const tabId = 'tab-' + tabCounter;

            // Create POST request
            const response = await fetch(`/tools/${toolId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'open', lang: '{{ .Lang }}' })
            });

            if (!response.ok) {
                alert('Error opening tool');
                return;
            }

            const htmlContent = await response.text();

            // Add tab
            const tabHTML = `
                <div class="tab-item" data-tab="${tabId}" onclick="switchTab('${tabId}')">
                    <span>${toolId.replace('-', ' ').replace(/\\b\\w/g, l => l.toUpperCase())}</span>
                    <button class="close-btn" onclick="event.stopPropagation(); closeTab('${tabId}')">×</button>
                </div>
            `;
            tabsBar.insertAdjacentHTML('beforeend', tabHTML);

            // Add content
            const contentHTML = `
                <div id="${tabId}" class="tab-panel">
                    <div class="tool-container">${htmlContent}</div>
                </div>
            `;
            toolTabs.insertAdjacentHTML('beforeend', contentHTML);

            switchTab(tabId);
            localStorage.setItem('openTabs', JSON.stringify(Array.from(document.querySelectorAll('.tab-item[data-tab]').map(t => t.dataset.tab))));
        }

        function switchTab(tabId) {
            // Update active tab
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function closeTab(tabId) {
            document.querySelector(`[data-tab="${tabId}"]`).remove();
            document.getElementById(tabId).remove();
            switchTab('home');
        }

        // Restore tabs
        window.addEventListener('load', () => {
            const openTabs = JSON.parse(localStorage.getItem('openTabs') || '[]');
            openTabs.forEach(tabId => switchTab(tabId));
        });
    </script>

    <style>
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .tabs-bar { display: flex; border-bottom: 1px solid #e2e8f0; background: white; }
        .tab-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid transparent; }
        .tab-item.active { border-bottom-color: #2563eb; background: #f8fafc; }
        .close-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; }
        .tab-content { flex: 1; overflow: auto; }
        .tab-panel { display: none; height: 100%; }
        .tab-panel.active { display: block; }
        .tool-card { cursor: pointer; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .tool-card:hover { background: #f8fafc; }
        .tool-icon { font-size: 24px; margin-right: 12px; }
        .open-tool-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .tool-container { height: 100%; padding: 20px; }
    </style>

    <footer class="footer">
        <div class="container-full">
            <div class="container">
                <p><strong>Our Mission:</strong> IT Tools is a collection of online tools designed to facilitate the daily work of developers.</p>
                <p>Made by mpons</p>
            </div>
        </div>
    </footer>
</body>
</html>
