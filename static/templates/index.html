<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.all" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            background: #f8fafc;
        }
        .app-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 20px 0;
            transition: width 0.3s ease;
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .sidebar.collapsed {
            width: 60px;
        }
        .search-input {
            width: 90%;
            margin: 0 5% 20px 5%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
        }
        .tool-link {
            display: block;
            padding: 16px 24px;
            color: #1e293b;
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        .tool-link .tool-name {
            display: block;
            font-weight: 500;
            line-height: 1.3;
        }
        .tool-link .tool-desc {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
            max-height: 2.6em;
        }
        .tool-link:hover, .tool-link.active {
            background: #f1f5f9;
            border-left-color: #2563eb;
            color: #2563eb;
        }
        .tool-name {
            font-weight: 500;
        }
        .tool-desc {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: white;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #64748b;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <input type="text" id="sidebar-search" placeholder="🔍 Search tools..." class="search-input">
            <div class="tools-list">
                {{ range .Tools }}
                <div class="tool-link" data-tool="{{ .ID }}" onclick="loadToolContent('{{ .ID }}')">
                    <span class="tool-name">{{ .Name }}</span>
                    <span class="tool-desc">{{ .Description }}</span>
                </div>
                {{ end }}
            </div>
        </aside>

        <div class="main-content">
            <div class="content-area" id="content-area">
                <div class="loading">
                    Select a tool from the sidebar to get started
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeToolLink = null;
        let sidebarCollapsed = false;

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('sidebar-search');
            const toolLinks = document.querySelectorAll('.tool-link');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                toolLinks.forEach(link => {
                    const text = link.textContent.toLowerCase();
                    link.style.display = text.includes(query) ? 'block' : 'none';
                });
            });
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            sidebarCollapsed = sidebar.classList.contains('collapsed');
        }

        async function loadToolContent(toolId) {
            // Clear previous active
            if (activeToolLink) activeToolLink.classList.remove('active');
            
            // Set active
            const toolLink = document.querySelector(`[data-tool="${toolId}"]`);
            toolLink.classList.add('active');
            activeToolLink = toolLink;
            
            // Show loading
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading ' + toolId.toUpperCase() + '...</div>';
            
            // AJAX call
            try {
                const response = await fetch(`/tools/${toolId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'open' })
                });
                
                if (response.ok) {
                    const html = await response.text();
                    contentArea.innerHTML = html;
                } else {
                    contentArea.innerHTML = '<div class="loading" style="color: #ef4444;">Error loading tool</div>';
                }
            } catch (error) {
                contentArea.innerHTML = '<div class="loading" style="color: #ef4444;">Network error</div>';
                console.error('Load error:', error);
            }
        }
    </script>
</body>
</html>
