<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Env Formatter</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Env Formatter</h1>
                <p>Paste your <code>.env</code> content, normalize and sort keys alphabetically.</p>
              </div>

  <div class="tool-grid">
    <div class="panel">
      <label for="env-input">Input (.env)</label>
      <textarea id="env-input" class="tool-textarea" rows="14" placeholder="APP_NAME=it-tools
PORT=8080
# Comment line
DEBUG=true"></textarea>
      <div class="actions">
        <button id="format-btn" type="button">Format</button>
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </div>

    <div class="panel">
      <label for="env-output">Formatted Output</label>
      <textarea id="env-output" class="tool-textarea" rows="14" readonly placeholder="Formatted output will appear here"></textarea>
      <div class="actions">
        <button id="copy-btn" type="button">Copy Output</button>
      </div>
    </div>
  </div>

              <div class="panel">
                <h2>Validation</h2>
                <ul id="env-errors" class="validation-list"></ul>
                <p id="env-status" class="status" aria-live="polite"></p>
              </div>
            </section>
        </div>
    </main>

<style>
  .tool-page { display: flex; flex-direction: column; gap: 12px; }
  .tool-header h1 { margin-bottom: 4px; font-size: 18px; }
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 12px; }
  .panel label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #94a3b8; }
  .tool-textarea { width: 100%; background: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; min-height: 120px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .actions button { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .actions button:hover { background: #2563eb; }
  .validation-list { margin: 0; padding-left: 18px; color: #fca5a5; font-size: 13px; }
  .status { margin-top: 8px; color: #64748b; min-height: 16px; font-size: 12px; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .tool-page > p { color: #64748b; font-size: 13px; margin: 0; }
</style>

<script>
  (function () {
    const inputEl = document.getElementById('env-input');
    const outputEl = document.getElementById('env-output');
    const errorsEl = document.getElementById('env-errors');
    const statusEl = document.getElementById('env-status');
    const formatBtn = document.getElementById('format-btn');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '<')
        .replaceAll('>', '>')
        .replaceAll('"', '"')
        .replaceAll("'", '&#39;');
    }

    function parseEnvLine(line, lineNumber) {
      const trimmed = line.trim();
      if (trimmed === '' || trimmed.startsWith('#')) {
        return { skip: true };
      }

      const equalIndex = trimmed.indexOf('=');
      if (equalIndex <= 0) {
        return {
          skip: false,
          error: 'Line ' + lineNumber + ': missing "=" separator.'
        };
      }

      const key = trimmed.slice(0, equalIndex).trim();
      const value = trimmed.slice(equalIndex + 1).trim();

      const keyPattern = /^[A-Za-z_][A-Za-z0-9_]*$/;
      if (!keyPattern.test(key)) {
        return {
          skip: false,
          error: 'Line ' + lineNumber + ': invalid key "' + key + '".'
        };
      }

      return {
        skip: false,
        key: key,
        value: value
      };
    }

    function formatEnv() {
      const raw = inputEl.value || '';
      const lines = raw.split(/\r?\n/);
      const entries = [];
      const errors = [];

      for (let i = 0; i < lines.length; i += 1) {
        const parsed = parseEnvLine(lines[i], i + 1);
        if (parsed.skip) {
          continue;
        }
        if (parsed.error) {
          errors.push(parsed.error);
          continue;
        }
        entries.push({ key: parsed.key, value: parsed.value });
      }

      entries.sort(function (a, b) {
        return a.key.localeCompare(b.key);
      });

      const formatted = entries.map(function (entry) {
        return entry.key + '=' + entry.value;
      }).join('\n');

      outputEl.value = formatted;
      errorsEl.innerHTML = errors.map(function (error) {
        return '<li>' + escapeHtml(error) + '</li>';
      }).join('');

      if (errors.length > 0 && formatted.length > 0) {
        setStatus('Formatted with validation warnings.');
      } else if (errors.length > 0) {
        setStatus('No valid entries found. Please fix input lines.');
      } else {
        setStatus('Formatting completed successfully.');
      }
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      errorsEl.innerHTML = '';
      setStatus('Cleared.');
    }

    async function copyOutput() {
      if (!outputEl.value) {
        setStatus('Nothing to copy.');
        return;
      }

      try {
        await navigator.clipboard.writeText(outputEl.value);
        setStatus('Formatted output copied to clipboard.');
      } catch (error) {
        setStatus('Clipboard copy failed. Please copy manually.');
      }
    }

    formatBtn.addEventListener('click', formatEnv);
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyOutput);
  })();
</script>
</body>
</html>
