<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Env Formatter</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Env Formatter</h1>
                <p>Paste your <code>.env</code> content, normalize and sort keys alphabetically.</p>
              </div>

  <div class="tool-grid">
    <div class="panel">
      <label for="env-input">Input (.env)</label>
      <textarea id="env-input" class="tool-textarea" rows="14" placeholder="APP_NAME=it-tools
PORT=8080
# Comment line
DEBUG=true"></textarea>
      <div class="actions">
        <button id="format-btn" type="button" class="btn-primary">Format</button>
        <button id="clear-btn" type="button" class="btn-secondary">Clear</button>
      </div>
    </div>

    <div class="panel">
      <label for="env-output">Formatted Output</label>
      <textarea id="env-output" class="tool-textarea" rows="14" readonly placeholder="Formatted output will appear here"></textarea>
      <div class="actions">
        <button id="copy-btn" type="button" class="btn-primary">Copy Output</button>
      </div>
    </div>
  </div>

              <div class="panel">
                <h2>Validation</h2>
                <ul id="env-errors" class="validation-list"></ul>
                <p id="env-status" class="status" aria-live="polite"></p>
              </div>
            </section>
        </div>
    </main>



<script src="/static/js/env-formatter.js"></script>
</body>
</html>
