<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.regex-tester.title" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="tool-container w-full max-w-full m-0 p-0">
                <h1>{{ tr "tools.regex-tester.title" }}</h1>
                <p>{{ tr "tools.regex-tester.desc" }}</p>

                <div class="regex-inputs">
                    <div class="input-group regex-group">
                        <span class="regex-slash">/</span>
                        <input type="text" id="regex-input" class="tool-input" placeholder="[a-z]+" value="[a-z]+">
                        <span class="regex-slash">/</span>
                        <input type="text" id="flags-input" class="tool-input flags-input" placeholder="gmi" value="g">
                    </div>
                    <div id="regex-error" class="error-message hidden">{{ tr "tools.regex-tester.error" }}</div>
                </div>

                <div class="tool-grid">
                    <div class="panel">
                        <label for="test-string">{{ tr "tools.regex-tester.test-string" }}</label>
                        <div class="editor-container">
                            <div id="highlight-backdrop" class="highlight-backdrop">
                                <div id="highlight-content" class="highlight-content"></div>
                            </div>
                            <textarea id="test-string" class="tool-textarea editor-textarea" spellcheck="false">This is a test string with some numbers 123 and symbols !@#.</textarea>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>{{ tr "tools.regex-tester.matches" }}</h2>
                        <div id="matches-output" class="matches-container">
                            <!-- Matches will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    

    <script src="/static/js/regex-tester.js"></script>
</body>
</html>
