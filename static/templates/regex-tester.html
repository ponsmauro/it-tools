<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.regex-tester.title" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="tool-container" style="width: 100%; max-width: 100%; margin: 0; padding: 0;">
                <h1>{{ tr "tools.regex-tester.title" }}</h1>
                <p>{{ tr "tools.regex-tester.desc" }}</p>

                <div class="regex-inputs">
                    <div class="input-group regex-group">
                        <span class="regex-slash">/</span>
                        <input type="text" id="regex-input" class="tool-input" placeholder="[a-z]+" value="[a-z]+">
                        <span class="regex-slash">/</span>
                        <input type="text" id="flags-input" class="tool-input flags-input" placeholder="gmi" value="g">
                    </div>
                    <div id="regex-error" class="error-message" style="display: none;">{{ tr "tools.regex-tester.error" }}</div>
                </div>

                <div class="tool-grid">
                    <div class="panel">
                        <label for="test-string">{{ tr "tools.regex-tester.test-string" }}</label>
                        <div class="editor-container">
                            <div id="highlight-backdrop" class="highlight-backdrop">
                                <div id="highlight-content" class="highlight-content"></div>
                            </div>
                            <textarea id="test-string" class="tool-textarea editor-textarea" spellcheck="false">This is a test string with some numbers 123 and symbols !@#.</textarea>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>{{ tr "tools.regex-tester.matches" }}</h2>
                        <div id="matches-output" class="matches-container">
                            <!-- Matches will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        .regex-inputs {
            margin-bottom: 24px;
        }
        .regex-group {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }
        .regex-group:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .regex-slash {
            font-size: 18px;
            color: var(--text-secondary);
            font-family: monospace;
            font-weight: bold;
        }
        .regex-group .tool-input {
            border: none;
            background: transparent;
            box-shadow: none;
            font-family: monospace;
            font-size: 16px;
        }
        .regex-group .tool-input:focus {
            outline: none;
            box-shadow: none;
        }
        .flags-input {
            width: 60px;
            flex: none;
        }
        .error-message {
            color: var(--error-text);
            font-size: 14px;
            margin-top: 8px;
        }
        
        /* Editor with highlighting */
        .editor-container {
            position: relative;
            height: 300px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            overflow: hidden;
        }
        .highlight-backdrop, .editor-textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
        }
        .editor-textarea {
            background: transparent;
            color: transparent;
            caret-color: var(--text-primary);
            border: none;
            resize: none;
            z-index: 2;
        }
        .editor-textarea:focus {
            outline: none;
        }
        .highlight-backdrop {
            z-index: 1;
            color: var(--text-primary);
        }
        .highlight-content {
            pointer-events: none;
        }
        .match-highlight {
            background-color: rgba(37, 99, 235, 0.2);
            border-radius: 2px;
            border-bottom: 2px solid var(--primary-color);
        }
        .match-highlight:nth-child(even) {
            background-color: rgba(16, 185, 129, 0.2);
            border-bottom: 2px solid #10b981;
        }

        /* Matches Output */
        .matches-container {
            height: 300px;
            overflow-y: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }
        .match-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .match-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .match-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
            font-family: monospace;
        }
        .match-group {
            font-size: 13px;
            color: var(--text-secondary);
            margin-left: 12px;
            font-family: monospace;
        }
        .no-matches {
            color: var(--text-secondary);
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }
    </style>

    <script>
        const regexInput = document.getElementById('regex-input');
        const flagsInput = document.getElementById('flags-input');
        const testString = document.getElementById('test-string');
        const highlightContent = document.getElementById('highlight-content');
        const matchesOutput = document.getElementById('matches-output');
        const errorMsg = document.getElementById('regex-error');

        // Sync scrolling between textarea and backdrop
        testString.addEventListener('scroll', () => {
            document.getElementById('highlight-backdrop').scrollTop = testString.scrollTop;
        });

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateRegex() {
            const pattern = regexInput.value;
            const flags = flagsInput.value;
            const text = testString.value;

            if (!pattern) {
                highlightContent.textContent = text;
                matchesOutput.innerHTML = `<div class="no-matches">{{ tr "tools.regex-tester.no-match" }}</div>`;
                errorMsg.style.display = 'none';
                return;
            }

            try {
                const regex = new RegExp(pattern, flags);
                errorMsg.style.display = 'none';

                // Find matches
                let match;
                const matches = [];
                
                // If global flag is not set, we only get the first match
                if (!regex.global) {
                    match = regex.exec(text);
                    if (match) matches.push(match);
                } else {
                    // Reset lastIndex just in case
                    regex.lastIndex = 0;
                    while ((match = regex.exec(text)) !== null) {
                        matches.push(match);
                        // Prevent infinite loop with zero-length matches
                        if (match.index === regex.lastIndex) {
                            regex.lastIndex++;
                        }
                    }
                }

                // Render matches list
                if (matches.length === 0) {
                    matchesOutput.innerHTML = `<div class="no-matches">{{ tr "tools.regex-tester.no-match" }}</div>`;
                    highlightContent.textContent = text;
                } else {
                    let html = '';
                    matches.forEach((m, i) => {
                        html += `<div class="match-item">`;
                        html += `<div class="match-header">Match ${i + 1}: "${escapeHtml(m[0])}" (Index: ${m.index})</div>`;
                        
                        // Render capture groups
                        for (let j = 1; j < m.length; j++) {
                            if (m[j] !== undefined) {
                                html += `<div class="match-group">Group ${j}: "${escapeHtml(m[j])}"</div>`;
                            }
                        }
                        html += `</div>`;
                    });
                    matchesOutput.innerHTML = html;

                    // Render highlights
                    let highlightedText = '';
                    let lastIndex = 0;

                    matches.forEach(m => {
                        // Add text before match
                        highlightedText += escapeHtml(text.substring(lastIndex, m.index));
                        // Add highlighted match
                        highlightedText += `<span class="match-highlight">${escapeHtml(m[0])}</span>`;
                        lastIndex = m.index + m[0].length;
                    });
                    // Add remaining text
                    highlightedText += escapeHtml(text.substring(lastIndex));

                    // Handle trailing newlines properly for the backdrop
                    if (text.endsWith('\n')) {
                        highlightedText += '<br>';
                    }

                    highlightContent.innerHTML = highlightedText;
                }

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                highlightContent.textContent = text;
                matchesOutput.innerHTML = `<div class="no-matches">{{ tr "tools.regex-tester.error" }}</div>`;
            }
        }

        regexInput.addEventListener('input', updateRegex);
        flagsInput.addEventListener('input', updateRegex);
        testString.addEventListener('input', updateRegex);

        // Initial update
        updateRegex();
    </script>
</body>
</html>
