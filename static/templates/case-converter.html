<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Case Converter</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Case Converter</h1>
                <p>Convert text between common naming and sentence styles.</p>
              </div>

  <div class="tool-grid">
    <div class="panel">
      <label for="input-text">Input text</label>
      <textarea id="input-text" class="tool-textarea" rows="8" placeholder="Paste text here..."></textarea>
      <div class="actions">
        <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
      </div>
    </div>

    <div class="panel">
      <h2>Converted outputs</h2>

      <div class="output-row">
        <label for="camel-output">camelCase</label>
        <textarea id="camel-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="camel-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="pascal-output">PascalCase</label>
        <textarea id="pascal-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="pascal-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="snake-output">snake_case</label>
        <textarea id="snake-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="snake-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="kebab-output">kebab-case</label>
        <textarea id="kebab-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="kebab-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="constant-output">CONSTANT_CASE</label>
        <textarea id="constant-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="constant-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="sentence-output">Sentence case</label>
        <textarea id="sentence-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="sentence-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="title-output">Title Case</label>
        <textarea id="title-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" class="btn-primary" data-copy-target="title-output">Copy</button>
      </div>
    </div>
  </div>

              <p id="status-message" class="status" aria-live="polite"></p>
            </section>
        </div>
    </main>



<script src="/static/js/case-converter.js"></script>
</body>
</html>
