{{define "case-converter.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<section class="tool-page">
  <div class="tool-header">
    <h1>Case Converter</h1>
    <p>Convert text between common naming and sentence styles.</p>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <label for="input-text">Input text</label>
      <textarea id="input-text" class="tool-textarea" rows="8" placeholder="Paste text here..."></textarea>
      <div class="actions">
        <button type="button" id="clear-btn">Clear</button>
      </div>
    </div>

    <div class="panel">
      <h2>Converted outputs</h2>

      <div class="output-row">
        <label for="camel-output">camelCase</label>
        <textarea id="camel-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="camel-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="pascal-output">PascalCase</label>
        <textarea id="pascal-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="pascal-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="snake-output">snake_case</label>
        <textarea id="snake-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="snake-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="kebab-output">kebab-case</label>
        <textarea id="kebab-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="kebab-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="constant-output">CONSTANT_CASE</label>
        <textarea id="constant-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="constant-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="sentence-output">Sentence case</label>
        <textarea id="sentence-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="sentence-output">Copy</button>
      </div>

      <div class="output-row">
        <label for="title-output">Title Case</label>
        <textarea id="title-output" class="tool-textarea" rows="2" readonly></textarea>
        <button type="button" data-copy-target="title-output">Copy</button>
      </div>
    </div>
  </div>

  <p id="status-message" class="status" aria-live="polite"></p>
</section>

<style>
  .tool-page { display: flex; flex-direction: column; gap: 1rem; }
  .tool-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .panel { border: 1px solid #374151; border-radius: 10px; padding: 1rem; background: #111827; }
  .tool-textarea {
    width: 100%;
    resize: vertical;
    border-radius: 8px;
    border: 1px solid #4b5563;
    background: #0b1220;
    color: #e5e7eb;
    padding: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    margin-top: 0.35rem;
  }
  .output-row { margin-bottom: 0.85rem; }
  .output-row button, .actions button {
    margin-top: 0.4rem;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    padding: 0.45rem 0.75rem;
    cursor: pointer;
    font-weight: 600;
  }
  .output-row button:hover, .actions button:hover { background: #1d4ed8; }
  .status { color: #93c5fd; min-height: 1.2rem; }
</style>

<script>
(function () {
  const inputEl = document.getElementById('input-text');
  const statusEl = document.getElementById('status-message');
  const clearBtn = document.getElementById('clear-btn');

  const outputs = {
    camel: document.getElementById('camel-output'),
    pascal: document.getElementById('pascal-output'),
    snake: document.getElementById('snake-output'),
    kebab: document.getElementById('kebab-output'),
    constant: document.getElementById('constant-output'),
    sentence: document.getElementById('sentence-output'),
    title: document.getElementById('title-output')
  };

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function toWords(text) {
    const normalized = (text || '')
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/[_\-]+/g, ' ')
      .replace(/[^\w\s]+/g, ' ')
      .trim()
      .toLowerCase();
    if (!normalized) {
      return [];
    }
    return normalized.split(/\s+/).filter(Boolean);
  }

  function toCamel(words) {
    if (words.length === 0) return '';
    return words[0] + words.slice(1).map(capitalize).join('');
  }

  function toPascal(words) {
    return words.map(capitalize).join('');
  }

  function toSnake(words) {
    return words.join('_');
  }

  function toKebab(words) {
    return words.join('-');
  }

  function toConstant(words) {
    return words.join('_').toUpperCase();
  }

  function toSentence(words) {
    if (words.length === 0) return '';
    const sentence = words.join(' ');
    return sentence.charAt(0).toUpperCase() + sentence.slice(1);
  }

  function toTitle(words) {
    return words.map(capitalize).join(' ');
  }

  function capitalize(word) {
    return word.charAt(0).toUpperCase() + word.slice(1);
  }

  function render() {
    const words = toWords(inputEl.value);

    outputs.camel.value = toCamel(words);
    outputs.pascal.value = toPascal(words);
    outputs.snake.value = toSnake(words);
    outputs.kebab.value = toKebab(words);
    outputs.constant.value = toConstant(words);
    outputs.sentence.value = toSentence(words);
    outputs.title.value = toTitle(words);

    if (words.length === 0) {
      setStatus('Enter text to convert.');
    } else {
      setStatus('Converted ' + words.length + ' words across all case styles.');
    }
  }

  async function copyFromTarget(targetId) {
    const element = document.getElementById(targetId);
    if (!element || !element.value) {
      setStatus('Nothing to copy for selected output.');
      return;
    }
    try {
      await navigator.clipboard.writeText(element.value);
      setStatus('Copied ' + targetId + ' to clipboard.');
    } catch (error) {
      setStatus('Clipboard copy failed. Please copy manually.');
    }
  }

  clearBtn.addEventListener('click', function () {
    inputEl.value = '';
    Object.values(outputs).forEach(function (el) { el.value = ''; });
    setStatus('Cleared.');
  });

  document.querySelectorAll('[data-copy-target]').forEach(function (button) {
    button.addEventListener('click', function () {
      copyFromTarget(button.getAttribute('data-copy-target'));
    });
  });

  inputEl.addEventListener('input', render);
  render();
})();
</script>
{{end}}
