<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.base64" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="tool-content base64-tool">
                <h1>{{ tr "tools.base64.title" }}</h1>
<!-- Removed redundant description -->

                <div class="mode-selector">
                    <button id="encode-tab" class="mode-tab active">{{ tr "tools.base64.encode" }}</button>
                    <button id="decode-tab" class="mode-tab">{{ tr "tools.base64.decode" }}</button>
                </div>
                
                <div class="options-panel">
                    <label class="option-label">
                        <input type="checkbox" id="url-safe"> {{ tr "tools.base64.url-safe" }}
                    </label>
                    <label class="option-label">
                        <input type="checkbox" id="include-padding" checked> {{ tr "tools.base64.include-padding" }}
                    </label>
                </div>

                <div class="tool-grid">
                    <div class="panel">
                        <label for="base64-input">{{ tr "tools.input" }}</label>
                        <textarea id="base64-input" class="tool-textarea" placeholder="{{ tr "tools.base64.input-placeholder" }}"></textarea>
                        
                        <div class="file-upload" id="file-upload-section">
                            <label for="file-input">{{ tr "tools.base64.file-upload" }}</label>
                            <input type="file" id="file-input" class="file-input">
                            <div class="file-info" id="file-info"></div>
                        </div>
                    </div>

                    <div class="panel actions">
                        <button type="button" id="btn-process" class="btn-primary">{{ tr "tools.base64.encode-btn" }}</button>
                        <button type="button" id="btn-clear" class="btn-secondary">{{ tr "tools.clear" }}</button>
                        <button type="button" id="btn-copy" class="btn-primary">{{ tr "tools.copy-output" }}</button>
                        <button type="button" id="btn-download" class="btn-primary" disabled>{{ tr "tools.base64.download" }}</button>
                    </div>

                    <div class="panel">
                        <label for="base64-output">{{ tr "tools.output" }}</label>
                        <textarea id="base64-output" class="tool-textarea" placeholder="{{ tr "tools.base64.output-placeholder" }}" readonly></textarea>
                    </div>
                </div>

                <div id="base64-status" class="status" aria-live="polite"></div>
                
                <div class="info-section">
                    <h2>{{ tr "tools.base64.about-title" }}</h2>
                    <p>{{ tr "tools.base64.about-desc" }}</p>
                    <ul>
                        <li>{{ tr "tools.base64.about-item1" }}</li>
                        <li>{{ tr "tools.base64.about-item2" }}</li>
                        <li>{{ tr "tools.base64.about-item3" }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <style>
        .base64-tool {
            width: 100%;
            max-width: 100%;
        }

        .base64-tool p {
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .mode-selector {
            display: flex;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .options-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            padding: 10px;
            background: var(--card-bg);
            border-radius: 6px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .mode-tab {
            padding: 8px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .mode-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tool-grid {
            display: grid;
            gap: 12px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel.actions {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
        }

        .tool-textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.4;
            resize: vertical;
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .file-upload {
            margin-top: 8px;
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
        }

        .file-info {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status {
            margin-top: 12px;
            min-height: 20px;
            font-size: 12px;
            color: var(--success-text);
            padding: 6px 10px;
            border-radius: 4px;
            background: var(--success-bg);
            display: none;
        }

        .status.error {
            color: var(--error-text);
            background: var(--error-bg);
        }

        .status.visible {
            display: block;
        }

        .info-section {
            margin-top: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 6px;
            border-left: 3px solid var(--primary-color);
        }

        .info-section ul {
            margin-top: 8px;
            padding-left: 20px;
        }

        .info-section li {
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .panel.actions {
                flex-direction: column;
                align-items: stretch;
            }
            
            .panel.actions .btn-primary, .panel.actions .btn-secondary {
                width: 100%;
            }
        }
    </style>

    <script>
        (function initBase64Tool() {
            const input = document.getElementById('base64-input');
            const output = document.getElementById('base64-output');
            const status = document.getElementById('base64-status');
            const processButton = document.getElementById('btn-process');
            const clearButton = document.getElementById('btn-clear');
            const copyButton = document.getElementById('btn-copy');
            const encodeTab = document.getElementById('encode-tab');
            const decodeTab = document.getElementById('decode-tab');
            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const fileUploadSection = document.getElementById('file-upload-section');
            
            let currentMode = 'encode';
            let currentFile = null;

            function setStatus(message, isError = false) {
                status.textContent = message;
                status.classList.toggle('error', isError);
                status.classList.add('visible');
                
                setTimeout(() => {
                    status.classList.remove('visible');
                }, 3000);
            }

            function switchMode(mode) {
                currentMode = mode;
                
                if (mode === 'encode') {
                    encodeTab.classList.add('active');
                    decodeTab.classList.remove('active');
                    processButton.textContent = '{{ tr "tools.base64.encode-btn" }}';
                    fileUploadSection.style.display = 'block';
                } else {
                    encodeTab.classList.remove('active');
                    decodeTab.classList.add('active');
                    processButton.textContent = '{{ tr "tools.base64.decode-btn" }}';
                    fileUploadSection.style.display = 'none';
                }
                
                // Clear outputs when switching modes
                output.value = '';
                currentFile = null;
                fileInfo.textContent = '';
            }

            function encodeBase64() {
                try {
                    if (currentFile) {
                        // File is already processed in the file input handler
                        return;
                    }
                    
                    if (!input.value.trim()) {
                        setStatus('{{ tr "tools.base64.no-input" }}', true);
                        return;
                    }
                    
                    const urlSafe = document.getElementById('url-safe').checked;
                    const includePadding = document.getElementById('include-padding').checked;
                    
                    // Standard Base64 encoding
                    let encoded = btoa(input.value);
                    
                    // Apply URL-safe transformation if needed
                    if (urlSafe) {
                        encoded = encoded.replace(/\+/g, '-').replace(/\//g, '_');
                    }
                    
                    // Remove padding if needed
                    if (!includePadding) {
                        encoded = encoded.replace(/=+$/, '');
                    }
                    
                    output.value = encoded;
                    setStatus('{{ tr "tools.base64.encode-success" }}');
                    document.getElementById('btn-download').disabled = true;
                } catch (error) {
                    setStatus('{{ tr "tools.base64.encode-error" }}', true);
                    console.error('Encode error:', error);
                }
            }

            function decodeBase64() {
                try {
                    if (!input.value.trim()) {
                        setStatus('{{ tr "tools.base64.no-input" }}', true);
                        return;
                    }
                    
                    const urlSafe = document.getElementById('url-safe').checked;
                    let encoded = input.value.trim();
                    
                    // Restore standard Base64 characters if URL-safe was used
                    if (urlSafe) {
                        encoded = encoded.replace(/-/g, '+').replace(/_/g, '/');
                    }
                    
                    // Add padding if needed
                    while (encoded.length % 4 !== 0) {
                        encoded += '=';
                    }
                    
                    // Try to decode
                    const decoded = atob(encoded);
                    output.value = decoded;
                    
                    // Enable download button if it looks like binary data
                    const isBinary = containsBinaryData(decoded);
                    document.getElementById('btn-download').disabled = !isBinary;
                    
                    setStatus('{{ tr "tools.base64.decode-success" }}');
                } catch (error) {
                    setStatus('{{ tr "tools.base64.decode-error" }}', true);
                    console.error('Decode error:', error);
                }
            }
            
            function containsBinaryData(str) {
                // Check if the string contains non-printable characters
                for (let i = 0; i < str.length; i++) {
                    const code = str.charCodeAt(i);
                    if (code < 32 && code !== 9 && code !== 10 && code !== 13) {
                        return true;
                    }
                }
                return false;
            }
            
            function downloadDecodedFile() {
                if (!output.value) {
                    setStatus('{{ tr "tools.base64.nothing-to-download" }}', true);
                    return;
                }
                
                try {
                    // Create a Blob from the decoded data
                    const blob = new Blob([output.value], { type: 'application/octet-stream' });
                    
                    // Create a download link
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'decoded_file';
                    
                    // Trigger download
                    document.body.appendChild(a);
                    a.click();
                    
                    // Cleanup
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 0);
                    
                    setStatus('{{ tr "tools.base64.download-started" }}');
                } catch (error) {
                    setStatus('{{ tr "tools.base64.download-error" }}', true);
                    console.error('Download error:', error);
                }
            }

            function processInput() {
                if (currentMode === 'encode') {
                    encodeBase64();
                } else {
                    decodeBase64();
                }
            }

            function clearAll() {
                input.value = '';
                output.value = '';
                currentFile = null;
                fileInfo.textContent = '';
                fileInput.value = '';
                setStatus('{{ tr "tools.base64.cleared" }}');
                input.focus();
            }

            async function copyOutput() {
                try {
                    if (!output.value) {
                        setStatus('{{ tr "tools.base64.nothing-to-copy" }}', true);
                        return;
                    }
                    
                    try {
                        await navigator.clipboard.writeText(output.value);
                        setStatus('{{ tr "tools.base64.copy-success" }}');
                    } catch (clipboardError) {
                        console.error('Clipboard API error:', clipboardError);
                        copyToClipboardFallback(output.value);
                        setStatus('{{ tr "tools.base64.copy-success" }}');
                    }
                } catch (error) {
                    setStatus('{{ tr "tools.base64.copy-error" }}', true);
                    console.error('Copy error:', error);
                }
            }
            
            function copyToClipboardFallback(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    const successful = document.execCommand('copy');
                    if (!successful) {
                        console.error('Fallback copy failed');
                    }
                } catch (err) {
                    console.error('Fallback copy error:', err);
                }
                
                document.body.removeChild(textArea);
            }

            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                // Check file size (limit to 5MB for browser performance)
                if (file.size > 5 * 1024 * 1024) {
                    setStatus('{{ tr "tools.base64.file-too-large" }}', true);
                    return;
                }
                
                currentFile = file;
                fileInfo.textContent = `${file.name} (${formatFileSize(file.size)})`;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        // Get the base64 part from the data URL
                        const base64String = e.target.result.split(',')[1];
                        
                        // Apply URL-safe and padding options
                        const urlSafe = document.getElementById('url-safe').checked;
                        const includePadding = document.getElementById('include-padding').checked;
                        
                        let encodedOutput = base64String;
                        
                        if (urlSafe) {
                            encodedOutput = encodedOutput.replace(/\+/g, '-').replace(/\//g, '_');
                        }
                        
                        if (!includePadding) {
                            encodedOutput = encodedOutput.replace(/=+$/, '');
                        }
                        
                        output.value = encodedOutput;
                        setStatus('{{ tr "tools.base64.file-encoded" }}');
                    } catch (error) {
                        setStatus('{{ tr "tools.base64.file-error" }}', true);
                        console.error('File processing error:', error);
                    }
                };
                
                reader.onerror = function() {
                    setStatus('{{ tr "tools.base64.file-read-error" }}', true);
                };
                
                reader.readAsDataURL(file);
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' bytes';
                else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                else return (bytes / 1048576).toFixed(1) + ' MB';
            }

            // Event listeners
            encodeTab.addEventListener('click', () => switchMode('encode'));
            decodeTab.addEventListener('click', () => switchMode('decode'));
            processButton.addEventListener('click', processInput);
            clearButton.addEventListener('click', clearAll);
            copyButton.addEventListener('click', copyOutput);
            fileInput.addEventListener('change', handleFileUpload);
            document.getElementById('btn-download').addEventListener('click', downloadDecodedFile);
            
            // Initialize
            switchMode('encode');
        })();
    </script>
</body>
</html>
