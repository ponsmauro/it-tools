<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Gzip Compressor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Gzip Compressor / Decompressor</h1>
                <p>Compress and decompress text using Gzip.</p>
              </div>

              <div class="mode-selector" style="margin-bottom: 16px;">
                <button id="compress-tab" class="mode-tab active">Compress</button>
                <button id="decompress-tab" class="mode-tab">Decompress</button>
              </div>

              <div class="tool-grid">
                <div class="panel">
                  <label for="gzip-input">Input</label>
                  <textarea id="gzip-input" class="tool-textarea" rows="10" placeholder="Paste text here..."></textarea>
                  <div class="actions">
                    <button id="process-btn" type="button" class="btn-primary">Compress</button>
                    <button id="clear-btn" type="button" class="btn-secondary">Clear</button>
                  </div>
                </div>

                <div class="panel">
                  <label for="gzip-output">Output (Base64 encoded when compressed)</label>
                  <textarea id="gzip-output" class="tool-textarea" rows="10" readonly></textarea>
                  <div class="actions">
                    <button id="copy-btn" type="button" class="btn-primary">Copy Output</button>
                  </div>
                  <div id="gzip-stats" class="stats-info" style="margin-top: 12px; display: none;">
                    <span id="stat-original"></span> &rarr; <span id="stat-compressed"></span> (<span id="stat-ratio"></span>)
                  </div>
                </div>
              </div>
            </section>
        </div>
    </main>

<style>
  .tool-page { display: flex; flex-direction: column; gap: 12px; }
  .tool-header h1 { margin-bottom: 4px; font-size: 18px; }
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; }
  .panel label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-secondary); }
  .tool-textarea { width: 100%; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .mode-selector { display: flex; gap: 8px; }
  .mode-tab { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .mode-tab.active { background: var(--primary-color); color: var(--text-primary); border-color: var(--primary-color); }
  .stats-info { color: var(--success-text); font-size: 13px; font-family: ui-monospace, monospace; }
  .tool-page > p { color: var(--text-secondary); font-size: 13px; margin: 0; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
  (function () {
    const inputEl = document.getElementById('gzip-input');
    const outputEl = document.getElementById('gzip-output');
    const processBtn = document.getElementById('process-btn');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');
    const compressTab = document.getElementById('compress-tab');
    const decompressTab = document.getElementById('decompress-tab');
    const statsEl = document.getElementById('gzip-stats');
    
    let mode = 'compress';

    function switchMode(newMode) {
      mode = newMode;
      if (mode === 'compress') {
        compressTab.classList.add('active');
        decompressTab.classList.remove('active');
        processBtn.textContent = 'Compress';
        inputEl.placeholder = 'Paste text to compress...';
      } else {
        compressTab.classList.remove('active');
        decompressTab.classList.add('active');
        processBtn.textContent = 'Decompress';
        inputEl.placeholder = 'Paste Base64 encoded gzip data...';
      }
      inputEl.value = '';
      outputEl.value = '';
      statsEl.style.display = 'none';
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function process() {
      const input = inputEl.value;
      if (!input) return;

      try {
        if (mode === 'compress') {
          // Compress
          const compressed = pako.gzip(input);
          // Convert to Base64
          const base64 = btoa(String.fromCharCode.apply(null, compressed));
          outputEl.value = base64;
          
          // Stats
          const origSize = new Blob([input]).size;
          const compSize = compressed.length;
          const ratio = ((1 - (compSize / origSize)) * 100).toFixed(1);
          
          document.getElementById('stat-original').textContent = formatBytes(origSize);
          document.getElementById('stat-compressed').textContent = formatBytes(compSize);
          document.getElementById('stat-ratio').textContent = ratio > 0 ? `-${ratio}%` : `+${Math.abs(ratio)}%`;
          statsEl.style.display = 'block';
          
        } else {
          // Decompress
          // Decode Base64
          const binaryString = atob(input);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          
          // Decompress
          const decompressed = pako.ungzip(bytes, { to: 'string' });
          outputEl.value = decompressed;
          statsEl.style.display = 'none';
        }
      } catch (err) {
        outputEl.value = `Error: ${err.message}`;
        statsEl.style.display = 'none';
      }
    }

    compressTab.addEventListener('click', () => switchMode('compress'));
    decompressTab.addEventListener('click', () => switchMode('decompress'));
    processBtn.addEventListener('click', process);
    
    clearBtn.addEventListener('click', () => {
      inputEl.value = '';
      outputEl.value = '';
      statsEl.style.display = 'none';
    });
    
    copyBtn.addEventListener('click', async () => {
      if (!outputEl.value) return;
      try {
        await navigator.clipboard.writeText(outputEl.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = originalText, 2000);
      } catch (err) {
        console.error('Failed to copy', err);
      }
    });
  })();
</script>
</body>
</html>
