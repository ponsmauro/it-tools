<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ tr "app.title" }} - {{ tr "tools.commander" }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  
</head>
<body>
  <main class="main">
    <div class="container">
      <h1>{{ tr "tools.commander.title" }}</h1>
      <p>{{ tr "tools.commander.desc" }}</p>
      <div class="coming-soon-banner">
        <div class="coming-soon-icon">📁</div>
        <span class="coming-soon-badge">Coming Soon</span>
        <div class="coming-soon-title">File Commander</div>
        <div class="coming-soon-desc">
          A dual-pane file manager inspired by Total Commander is under development.
          It will support copy, move, delete, and rename operations between two directory panels.
        </div>
      </div>
    </div>
  </main>
</body>
</html>
