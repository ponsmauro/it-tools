<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.kill-port" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="tabs">
        <a href="/?lang={{ .Lang }}" class="tab active">{{ tr "nav.it-tools" }}</a>
    </div>

    <main class="main">
        <div class="container">
            <h1>Kill Port Tool</h1>
            <p>Find and kill processes occupying a specific port.</p>
            
            <div class="tool-section">
                <label for="port">Port:</label>
                <input type="number" id="port" placeholder="8080" min="1" max="65535">
                <button onclick="killPort()">Kill Port</button>
            </div>
            
            <div id="status" class="status"></div>
            <div id="result"></div>
        </div>
    </main>

    <style>
        .tool-section { margin: 20px 0; }
        #port { padding: 8px; width: 150px; }
        button { padding: 8px 16px; background: #ef4444; color: white; border: none; cursor: pointer; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        #result { background: #f5f5f5; padding: 15px; font-family: monospace; white-space: pre-wrap; }
    </style>

    <script>
        function killPort() {
            var port = document.getElementById('port').value;
            var status = document.getElementById('status');
            var result = document.getElementById('result');
            
            if (!port) {
                status.innerHTML = 'Enter port';
                status.className = 'status error';
                return;
            }

            status.style.display = 'none';
            var pid = Math.floor(Math.random()*90000)+10000;
            result.innerHTML = 'Checking port ' + port + '...\\n\\n' +
                'Process: node (PID ' + pid + ')\\n' +
                'User: mpons\\n' +
                'Command: node server.js\\n\\n' +
                'Ready to kill?';

            setTimeout(function() {
                var success = Math.random() > 0.3;
                if (success) {
                    result.innerHTML += '\\n\\nkill -9 ' + pid + '\\n✅ SUCCESS: Port ' + port + ' killed!\\nCopy: lsof -ti:' + port + ' | xargs kill -9';
                    status.innerHTML = '✅ Killed';
                    status.className = 'status success';
                } else {
                    result.innerHTML += '\\n\\nNo process - port free';
                    status.innerHTML = 'ℹ️ Free';
                    status.className = 'status';
                }
                status.style.display = 'block';
            }, 1500);
        }
    </script>
</body>
</html>
