<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.hash-generator.title" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="tool-container">
                <h1>{{ tr "tools.hash-generator.title" }}</h1>
                <p>{{ tr "tools.hash-generator.desc" }}</p>

                <div class="tool-grid">
                    <div class="panel">
                        <label for="hash-input">{{ tr "tools.input" }}</label>
                        <textarea id="hash-input" class="tool-textarea" rows="6" placeholder="Type or paste text here..."></textarea>
                        
                        <div class="options-panel mt-12">
                            <label class="option-label">
                                <input type="checkbox" id="uppercase-output"> {{ tr "tools.hash-generator.uppercase" }}
                            </label>
                        </div>
                        
                        <div class="actions">
                            <button type="button" id="btn-clear" class="btn-secondary">{{ tr "tools.clear" }}</button>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>{{ tr "tools.output" }}</h2>
                        
                        <div class="hash-output-group">
                            <label>SHA-1</label>
                            <div class="output-with-copy">
                                <input type="text" id="out-sha1" class="tool-input" readonly>
                                <button class="btn-icon" onclick="copyText('out-sha1')" title="{{ tr "tools.copy" }}">📋</button>
                            </div>

                            <label>SHA-256</label>
                            <div class="output-with-copy">
                                <input type="text" id="out-sha256" class="tool-input" readonly>
                                <button class="btn-icon" onclick="copyText('out-sha256')" title="{{ tr "tools.copy" }}">📋</button>
                            </div>

                            <label>SHA-384</label>
                            <div class="output-with-copy">
                                <input type="text" id="out-sha384" class="tool-input" readonly>
                                <button class="btn-icon" onclick="copyText('out-sha384')" title="{{ tr "tools.copy" }}">📋</button>
                            </div>

                            <label>SHA-512</label>
                            <div class="output-with-copy">
                                <input type="text" id="out-sha512" class="tool-input" readonly>
                                <button class="btn-icon" onclick="copyText('out-sha512')" title="{{ tr "tools.copy" }}">📋</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    

    <script src="/static/js/hash-generator.js"></script>
</body>
</html>
