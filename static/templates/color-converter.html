<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - {{ tr "tools.color-converter.title" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="tool-container">
                <h1>{{ tr "tools.color-converter.title" }}</h1>
                <p>{{ tr "tools.color-converter.desc" }}</p>

                <div class="tool-grid">
                    <div class="panel">
                        <label for="color-input">{{ tr "tools.input" }}</label>
                        <div class="input-group">
                            <input type="color" id="color-picker" class="color-picker" value="#2563eb">
                            <input type="text" id="color-input" class="tool-input" placeholder="#2563eb, rgb(37, 99, 235), hsl(221, 83%, 53%)" value="#2563eb">
                        </div>
                        
                        <div class="color-preview" id="color-preview"></div>
                    </div>

                    <div class="panel">
                        <h2>{{ tr "tools.output" }}</h2>
                        
                        <div class="output-group">
                            <label for="out-hex">{{ tr "tools.color-converter.hex" }}</label>
                            <div class="input-with-button">
                                <input type="text" id="out-hex" class="tool-input" readonly>
                                <button type="button" class="btn-primary btn-copy" data-target="out-hex">{{ tr "tools.copy" }}</button>
                            </div>
                        </div>

                        <div class="output-group">
                            <label for="out-rgb">{{ tr "tools.color-converter.rgb" }}</label>
                            <div class="input-with-button">
                                <input type="text" id="out-rgb" class="tool-input" readonly>
                                <button type="button" class="btn-primary btn-copy" data-target="out-rgb">{{ tr "tools.copy" }}</button>
                            </div>
                        </div>

                        <div class="output-group">
                            <label for="out-hsl">{{ tr "tools.color-converter.hsl" }}</label>
                            <div class="input-with-button">
                                <input type="text" id="out-hsl" class="tool-input" readonly>
                                <button type="button" class="btn-primary btn-copy" data-target="out-hsl">{{ tr "tools.copy" }}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    

    <script src="/static/js/color-converter.js"></script>
</body>
</html>
