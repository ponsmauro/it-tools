<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Terminal - IT Tools</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .terminal-container { 
      height: 80vh; 
      background: #000; 
      color: #0f0; 
      font-family: 'Courier New', monospace; 
      padding: 20px; 
      border-radius: 8px;
      max-width: 100%;
      overflow: hidden;
    }
    .terminal-input { 
      width: 100%; 
      background: transparent; 
      border: none; 
      color: #0f0; 
      font-family: inherit; 
      font-size: 16px;
    }
    .terminal-input:focus { outline: none; }
    .prompt { color: #fff; }
  </style>
</head>
<body>
  <div class="tabs">
    <a href="/" class="tab active">IT Tools</a>
  </div>
  <main class="main">
    <div class="container">
      <h1>💻 Web Terminal</h1>
      <p>Mock PC terminal emulator (frontend JS shell)</p>
      <div class="terminal-container" id="terminal">
        <div>Welcome to mock shell v1.0</div>
        <div>pwd: /home/user</div>
        <div>ls: dir1 docs image.png</div>
        <div class="prompt">$ </div>
      </div>
      <textarea class="terminal-input" id="input" placeholder="Type commands: ls, cd dir1, pwd, cat file1.txt, clear..." autofocus></textarea>
    </div>
  </main>
  <script>
    const term = document.getElementById('terminal');
    const input = document.getElementById('input');
    const mockFS = {
      '/home/user': { files: ['dir1/', 'docs/', 'image.png'], dir1: { files: ['file1.txt'] } }
    };
    let cwd = '/home/user';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const cmd = input.value.trim();
        input.value = '';
        const line = document.createElement('div');
        line.textContent = `$ ${cmd}`;
        term.appendChild(line);
        // Mock commands
        if (cmd === 'ls') {
          line = document.createElement('div');
          line.textContent = mockFS[cwd]?.files?.join(' ') || 'empty';
          term.appendChild(line);
        } else if (cmd === 'pwd') {
          line = document.createElement('div');
          line.textContent = `pwd: ${cwd}`;
          term.appendChild(line);
        } else if (cmd === 'clear') {
          term.innerHTML = '<div>Terminal cleared</div><div class="prompt">$ </div>';
          return;
        } else {
          line = document.createElement('div');
          line.textContent = `command not found: ${cmd}`;
          term.appendChild(line);
        }
        line = document.createElement('div');
        line.className = 'prompt';
        line.textContent = '$ ';
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
      }
    });
  </script>
</body>
</html>
