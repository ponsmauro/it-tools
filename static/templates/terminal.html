<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ tr "app.title" }} - {{ tr "tools.terminal" }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  
</head>
<body>
  <main class="main">
    <div class="container">
      <h1>{{ tr "tools.terminal.title" }}</h1>
      <p>{{ tr "tools.terminal.desc" }}</p>
      <div class="coming-soon-banner">
        <div class="coming-soon-icon">💻</div>
        <span class="coming-soon-badge">Coming Soon</span>
        <div class="coming-soon-title">Web Terminal</div>
        <div class="coming-soon-desc">
          A fully interactive browser-based terminal emulator is under development.
          It will support common shell commands, a mock filesystem, and command history.
        </div>
      </div>
    </div>
  </main>
</body>
</html>
