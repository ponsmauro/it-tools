<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr "app.title" }} - Cron Expression Parser</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <section class="tool-page">
              <div class="tool-header">
                <h1>Cron Expression Parser</h1>
                <p>Parse and explain cron expressions.</p>
              </div>

              <div class="tool-grid">
                <div class="panel">
                  <label for="cron-input">Cron Expression</label>
                  <input type="text" id="cron-input" class="tool-input" value="* * * * *" placeholder="* * * * *">
                  <div class="actions">
                    <button id="parse-btn" type="button" class="btn-primary">Parse</button>
                  </div>
                </div>

                <div class="panel">
                  <h2>Explanation</h2>
                  <div id="cron-explanation" class="cron-explanation">
                    Every minute
                  </div>
                  
                  <h3 class="next-occurrences-title">Next occurrences <small class="next-occurrences-note">(approximate — based on 1-minute intervals)</small></h3>
                  <ul id="cron-next" class="cron-next-list">
                  </ul>
                </div>
              </div>
            </section>
        </div>
    </main>



<script src="https://cdn.jsdelivr.net/npm/cronstrue@2.26.0/cronstrue.min.js"></script>
<script src="/static/js/cron-parser.js"></script>
</body>
</html>
